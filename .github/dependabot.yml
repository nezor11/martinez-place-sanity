# Weekly dependency updates for the Studio. Every PR runs CI (lint, typecheck,
# schema validation, build); minor and patch bumps arrive grouped, majors one
# by one. Sanity ships often, so the grouped PR keeps the Studio current.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Madrid
    labels: [dependencies]
    commit-message:
      prefix: "chore(ci)"
